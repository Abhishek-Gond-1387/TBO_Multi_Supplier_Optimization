<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBO | Multi-Supplier Discovery</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: light; --ink:#172b3a; --muted:#6c7b86; --line:#e4eaed; --accent:#087f8c; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 Inter,Segoe UI,Arial,sans-serif; color:var(--ink); background:#f4f7f8; }
    header { min-height:72px; padding:14px 22px; display:flex; align-items:center; gap:16px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-weight:800; letter-spacing:.03em; white-space:nowrap; }.brand span { color:var(--accent); }
    .search { display:flex; align-items:center; gap:8px; width:min(760px,100%); margin:auto; }
    input,select,button { border:1px solid #d8e0e4; border-radius:9px; padding:10px 12px; background:#fff; color:var(--ink); font:inherit; }
    input { flex:1; min-width:120px; } button { cursor:pointer; font-weight:650; } button.primary { background:var(--accent); color:white; border-color:var(--accent); }
    button:hover { filter:brightness(.96); } .layout { height:calc(100vh - 72px); display:grid; grid-template-columns:minmax(310px,380px) 1fr; }
    aside { overflow:auto; padding:20px; background:#fff; border-right:1px solid var(--line); }
    .eyebrow { margin:0 0 4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0 0 18px; font-size:22px; } .summary { display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; color:var(--muted); }
    .card { padding:15px 0; border-top:1px solid var(--line); } .card h2 { margin:0 0 5px; font-size:15px; }
    .meta { color:var(--muted); font-size:12px; }.price-row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
    .price { font-size:19px; font-weight:750; } .badge { padding:4px 7px; border-radius:5px; color:#09636a; background:#e4f5f3; font-size:10px; font-weight:700; }
    #map { width:100%; height:100%; } .pin { min-width:48px; padding:5px 7px; text-align:center; color:#12303b; background:#fff; border:1px solid #b8d0d4; border-radius:14px; box-shadow:0 2px 8px #16354430; font-weight:750; }
    .empty { color:var(--muted); padding:22px 0; }.error { color:#a53030; padding:12px 0; font-size:13px; }
    @media(max-width:720px) { header { height:auto; flex-wrap:wrap; padding:12px; } .brand { width:100%; } .search { flex-wrap:wrap; } .layout { height:calc(100vh - 126px); grid-template-columns:1fr; grid-template-rows:42% 58%; } aside { order:2; padding:14px; border:0; } #map { order:1; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">TBO <span>DISCOVERY</span></div>
    <form class="search" id="search-form">
      <input id="query" aria-label="Search inventory" placeholder="Hotel, area, or amenity">
      <select id="stars" aria-label="Minimum star rating"><option value="">Any rating</option><option value="3">3+ stars</option><option value="4">4+ stars</option><option value="5">5 stars</option></select>
      <input id="max-price" type="number" min="1" placeholder="Max price USD" aria-label="Maximum price">
      <button class="primary" type="submit">Search</button>
      <button type="button" id="voice" title="Search by voice">🎙</button>
    </form>
  </header>
  <main class="layout">
    <aside>
      <p class="eyebrow">Dubai · Hotel stays</p>
      <h1>Find your next stay</h1>
      <div class="summary"><span id="result-count">Loading stays…</span><span>Ranked across suppliers</span></div>
      <div id="results"></div>
    </aside>
    <div id="map" aria-label="Hotel map"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = 'http://127.0.0.1:8000/api/v1';
    const map = L.map('map').setView([25.1972, 55.2744], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);
    const markers = L.layerGroup().addTo(map);
    const results = document.getElementById('results');
    const count = document.getElementById('result-count');
    const money = (offer) => offer ? new Intl.NumberFormat(undefined, { style:'currency', currency:offer.currency, maximumFractionDigits:0 }).format(offer.price) : 'Price on request';

    function renderCards(rows) {
      results.replaceChildren();
      if (!rows.length) { results.innerHTML = '<div class="empty">No stays match these filters. Try widening your search.</div>'; return; }
      rows.forEach(({item, badges}) => {
        const offer = item.offers.filter(o => o.available).sort((a,b) => a.price-b.price)[0];
        const card = document.createElement('article'); card.className = 'card';
        card.innerHTML = `<h2>${escapeHtml(item.name)}</h2><div class="meta">${item.star_rating || '—'} stars · ${escapeHtml(item.destination)} · ${item.offers.length} supplier offers</div><div class="price-row"><span class="price">${money(offer)}</span><span class="badge">${escapeHtml(badges[0] || 'COMPARE')}</span></div>`;
        results.append(card);
      });
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    async function loadSearch() {
      count.textContent = 'Searching…';
      const params = new URLSearchParams({ entity_type:'HOTEL', destination:'Dubai', q:document.getElementById('query').value.trim() });
      const stars = document.getElementById('stars').value, price = document.getElementById('max-price').value;
      if (stars) params.set('min_stars', stars); if (price) params.set('max_price', price);
      try {
        const response = await fetch(`${API}/inventory/search?${params}`);
        if (!response.ok) throw new Error(`API returned ${response.status}`);
        const data = await response.json(); count.textContent = `${data.count} stays`; renderCards(data.results);
      } catch (error) { count.textContent = 'API unavailable'; results.innerHTML = `<div class="error">Could not load results. Start the API at 127.0.0.1:8000.<br>${escapeHtml(error.message)}</div>`; }
    }
    async function loadViewport() {
      const b = map.getBounds(); const params = new URLSearchParams({ entity_type:'HOTEL', west:b.getWest(), south:b.getSouth(), east:b.getEast(), north:b.getNorth() });
      try {
        const response = await fetch(`${API}/inventory?${params}`); if (!response.ok) return;
        const {items} = await response.json(); markers.clearLayers();
        items.forEach(item => {
          const offer = item.offers.filter(o => o.available).sort((a,b) => a.price-b.price)[0];
          const label = offer ? money(offer) : 'View';
          const icon = L.divIcon({className:'', html:`<div class="pin">${escapeHtml(label)}</div>`, iconSize:[72,32], iconAnchor:[36,16]});
          L.marker([item.latitude,item.longitude], {icon}).bindPopup(`<strong>${escapeHtml(item.name)}</strong><br>${item.star_rating || '—'} stars · ${escapeHtml(item.destination)}<br>Best available: ${escapeHtml(label)}`).addTo(markers);
        });
      } catch (_) { /* Search panel reports API errors. */ }
    }
    document.getElementById('search-form').addEventListener('submit', event => { event.preventDefault(); loadSearch(); });
    map.on('moveend', loadViewport);
    document.getElementById('voice').addEventListener('click', () => {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) { alert('Voice search is not available in this browser.'); return; }
      const recognition = new Recognition(); recognition.lang = 'en-US'; recognition.interimResults = false;
      recognition.onresult = async event => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('query').value = transcript;
        try {
          const response = await fetch(`${API}/voice/query`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({transcript}) });
          const data = await response.json(); count.textContent = `${data.count} voice matches`; renderCards(data.results);
        } catch (_) { loadSearch(); }
      };
      recognition.start();
    });
    loadSearch(); loadViewport();
  </script>
</body>
</html>
